  <!-- Navigation Header -->
  <header>
    <div class="nav-container">
      <div class="logo">WanderLux Travels</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="packages.html">Packages</a>
        <a href="booking.html">Booking</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="contact.html">About & Contact</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    
    <div class="page-title">
      <h1>Destination Photo Gallery</h1>
      <p>Take a look at the beautiful destinations you can explore with us.</p>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid">
      
      <!-- Image 1: Santorini -->
      <figure class="gallery-card">
        <img src="images/santorini.jpg" alt="Santorini white cliffside buildings and sea in Greece">
        <figcaption>
          <h3>Santorini, Greece</h3>
          <p>Famous for iconic blue domed churches, white cliffside villages, and sunset views over the Aegean Sea.</p>
        </figcaption>
      </figure>

      <!-- Image 2: Bali -->
      <figure class="gallery-card">
        <img src="images/bali.jpg" alt="Lush green Tegallalang rice terraces in Bali Indonesia">
        <figcaption>
          <h3>Bali, Indonesia</h3>
          <p>Lush green rice terraces in Ubud, tropical beaches, and serene spiritual temples.</p>
        </figcaption>
      </figure>

      <!-- Image 3: Swiss Alps -->
      <figure class="gallery-card">
        <img src="images/swiss-alps.jpg" alt="Swiss Alps snow mountains and lake in Switzerland">
        <figcaption>
          <h3>Swiss Alps, Switzerland</h3>
          <p>Majestic snow-covered mountains, clear alpine lakes, and traditional wooden village chalets.</p>
        </figcaption>
      </figure>

      <!-- Image 4: Kyoto -->
      <figure class="gallery-card">
        <img src="images/kyoto.jpg" alt="Historic Kyoto street with pagoda and cherry blossoms in Japan">
        <figcaption>
          <h3>Kyoto, Japan</h3>
          <p>Historic temples, cobblestone streets, and stunning cherry blossoms during the spring season.</p>
        </figcaption>
      </figure>

      <!-- Image 5: Rome -->
      <figure class="gallery-card">
        <img src="images/rome.jpg" alt="Ancient Colosseum during sunset in Rome Italy">
        <figcaption>
          <h3>Rome, Italy</h3>
          <p>Ancient Roman history featuring the Colosseum, cobblestone streets, and vibrant culture.</p>
        </figcaption>
      </figure>

      <!-- Image 6: Maldives -->
      <figure class="gallery-card">
        <img src="images/maldives.jpg" alt="Overwater luxury bungalows in the Maldives">
        <figcaption>
          <h3>Maldives</h3>
          <p>Luxury overwater wooden villas surrounded by crystal clear turquoise ocean lagoons.</p>
        </figcaption>
      </figure>

    </div>

  </main>
